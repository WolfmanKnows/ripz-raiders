<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RIPZ Raiders — Explorable</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  body { margin:0; background:#0d0e12; color:#f5f0e6; font-family:system-ui,sans-serif; overflow:hidden; }
  #game { display:block; margin:0 auto; background:#1a1c24; }
  #ui { position:fixed; bottom:10px; left:0; right:0; text-align:center; pointer-events:none; }
  #log { background:rgba(0,0,0,0.7); padding:8px 12px; border-radius:8px; display:inline-block; max-width:90%; font-size:14px; }
  button { pointer-events:auto; margin:4px; padding:10px 16px; background:#c9a227; color:#111; border:none; border-radius:8px; font-weight:600; }
  #battle-ui { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); padding:20px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="log">Walk around with arrow keys or WASD. Approach the scalper.</div>
</div>
<div id="battle-ui">
  <h2 id="btitle">Battle</h2>
  <p id="blog"></p>
  <button onclick="doMove('peck')">Peck</button>
  <button onclick="doMove('hoot')">Hoot Blast</button>
  <button onclick="endBattle()">Flee</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = Math.min(window.innerWidth, 480);
canvas.height = Math.min(window.innerHeight - 80, 640);

const TILE = 32;
const mapW = 16, mapH = 12;
let player = { x: 4*TILE, y: 6*TILE, w: 24, h: 24, speed: 2 };
let keys = {};
let npcs = [
  { x: 10*TILE, y: 4*TILE, w: 28, h: 28, type: 'scalper', talked: false }
];
let inBattle = false;
let playerHp = 30, enemyHp = 35;

function draw() {
  ctx.fillStyle = '#2a3a2a';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  for (let y=0; y<mapH; y++) {
    for (let x=0; x<mapW; x++) {
      ctx.fillStyle = (x+y)%2===0 ? '#3a4a3a' : '#2f3f2f';
      ctx.fillRect(x*TILE, y*TILE, TILE, TILE);
    }
  }
  ctx.fillStyle = '#555';
  ctx.fillRect(0,0,canvas.width, TILE);
  ctx.fillRect(0,canvas.height-TILE,canvas.width, TILE);
  ctx.fillRect(0,0,TILE,canvas.height);
  ctx.fillRect(canvas.width-TILE,0,TILE,canvas.height);

  npcs.forEach(n => {
    ctx.fillStyle = n.type==='scalper' ? '#333' : '#666';
    ctx.fillRect(n.x, n.y, n.w, n.h);
    ctx.fillStyle = '#c9a227';
    ctx.font = '10px sans-serif';
    ctx.fillText('SCALPER', n.x-4, n.y-4);
  });

  ctx.fillStyle = '#e75492';
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.fillStyle = '#fff';
  ctx.font = '10px sans-serif';
  ctx.fillText('YOU', player.x, player.y-4);
}

function update() {
  if (inBattle) return;
  let nx = player.x, ny = player.y;
  if (keys['ArrowLeft'] || keys['a']) nx -= player.speed;
  if (keys['ArrowRight'] || keys['d']) nx += player.speed;
  if (keys['ArrowUp'] || keys['w']) ny -= player.speed;
  if (keys['ArrowDown'] || keys['s']) ny += player.speed;
  if (nx > TILE && nx < canvas.width - TILE - player.w) player.x = nx;
  if (ny > TILE && ny < canvas.height - TILE - player.h) player.y = ny;

  npcs.forEach(n => {
    const dx = (player.x + player.w/2) - (n.x + n.w/2);
    const dy = (player.y + player.h/2) - (n.y + n.h/2);
    if (Math.hypot(dx,dy) < 40 && !n.talked) {
      document.getElementById('log').textContent = 'Scalper: "Just grabbing a few packs for the kids..."';
    }
    if (Math.hypot(dx,dy) < 28) {
      startEncounter(n);
    }
  });
}

function startEncounter(npc) {
  if (inBattle) return;
  inBattle = true;
  npc.talked = true;
  document.getElementById('log').textContent = 'You\'re not who you said you were! You\'re trying to buy out Walmart!';
  document.getElementById('battle-ui').style.display = 'block';
  document.getElementById('btitle').textContent = 'vs Exposed Scalper';
  document.getElementById('blog').textContent = 'Bootleg Bird appears!';
  playerHp = 30; enemyHp = 35;
}

function doMove(move) {
  if (!inBattle) return;
  let dmg = move==='peck' ? 8 : 12;
  enemyHp -= dmg;
  document.getElementById('blog').textContent = `You used ${move}! Enemy HP: ${Math.max(0,enemyHp)}`;
  if (enemyHp <= 0) {
    document.getElementById('blog').textContent = 'You win! You saved the stock for the kids!';
    setTimeout(endBattle, 1200);
    return;
  }
  setTimeout(() => {
    playerHp -= 7;
    document.getElementById('blog').textContent += ` | Enemy attacks! Your HP: ${Math.max(0,playerHp)}`;
    if (playerHp <= 0) {
      document.getElementById('blog').textContent = 'You lost. The scalper buys all the stock.';
      setTimeout(endBattle, 1200);
    }
  }, 600);
}

function endBattle() {
  inBattle = false;
  document.getElementById('battle-ui').style.display = 'none';
  document.getElementById('log').textContent = 'Walk around and explore.';
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

let touchStart = null;
canvas.addEventListener('touchstart', e => {
  touchStart = e.touches[0];
});
canvas.addEventListener('touchmove', e => {
  if (!touchStart) return;
  const t = e.touches[0];
  const dx = t.clientX - touchStart.clientX;
  const dy = t.clientY - touchStart.clientY;
  keys = {};
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 10) keys['ArrowRight'] = true;
    if (dx < -10) keys['ArrowLeft'] = true;
  } else {
    if (dy > 10) keys['ArrowDown'] = true;
    if (dy < -10) keys['ArrowUp'] = true;
  }
});
canvas.addEventListener('touchend', () => { keys = {}; touchStart = null; });
</script>
</body>
</html>
